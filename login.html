<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CICLOVA LOGIN</title>
    
    <!-- Enlace a tu CSS Externo -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Fuentes y Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (Configuración via Script para CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ciclova: {
                            bg: '#0B1F14',
                            card: '#1E3A2E',
                            neon: '#39FF6B',
                            light: '#A7F3D0',
                            text: '#FFFFFF',
                            muted: '#A0B8A8',
                            alert: '#FF4B4B',
                            warning: '#FFD166',
                            blueprint: '#38BDF8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center justify-center relative px-4 py-8">

    <!-- Fondos decorativos -->
    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <!-- Botón Volver -->
    <a href="index.html" class="absolute top-6 left-6 text-ciclova-muted hover:text-white flex items-center gap-2 transition-colors">
        <i class="ph-bold ph-arrow-left"></i>
        <span class="text-sm font-medium">Volver</span>
    </a>

    <main class="w-full max-w-[420px] relative z-10 flex flex-col items-center">
        
        <!-- Logo y Título -->
        <div class="flex flex-col items-center mb-8 text-center cursor-default">
            <div class="w-16 h-16 rounded-2xl bg-ciclova-card flex items-center justify-center border border-white/10 shadow-lg mb-4">
                <i class="ph-fill ph-plant text-ciclova-neon text-4xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-wider mb-1">CICLOVA</h1>
            <p class="text-ciclova-muted text-sm">Tu residuo, una nueva oportunidad.</p>
        </div>

        <!-- Tarjeta de Login/Registro -->
        <div class="w-full bg-ciclova-card/60 backdrop-blur-xl border border-white/5 rounded-[2rem] p-6 md:p-8 shadow-2xl transition-all duration-500">
            
            <h2 id="form-title" class="text-xl font-bold text-center mb-6">Iniciar sesión</h2>

            <!-- Selector (Toggle) Iniciar Sesión / Crear Cuenta -->
            <div id="toggle-container" class="flex p-1 bg-ciclova-bg rounded-xl mb-8 border border-white/5 relative">
                <div id="toggle-bg" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-ciclova-card rounded-lg shadow-sm transition-transform duration-300 ease-in-out"></div>
                
                <button id="btn-tab-login" onclick="switchTab('login')" class="relative z-10 flex-1 py-2.5 rounded-lg text-sm font-semibold text-white transition-colors">
                    Iniciar sesión
                </button>
                <button id="btn-tab-register" onclick="switchTab('register')" class="relative z-10 flex-1 py-2.5 rounded-lg text-sm font-semibold text-ciclova-muted hover:text-white transition-colors">
                    Crear cuenta
                </button>
            </div>

            <!-- Formulario -->
            <form id="auth-form" onsubmit="handleAuth(event)">
                
                <!-- Nombre (Solo para registro) -->
                <div id="name-group" class="input-group collapsed mb-0">
                    <div class="relative mb-4">
                        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-ciclova-muted text-lg"></i>
                        <input type="text" id="name-input" placeholder="Nombre completo" 
                            class="w-full bg-ciclova-bg border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white text-sm focus:border-ciclova-neon focus:ring-1 focus:ring-ciclova-neon focus:outline-none transition-all placeholder-ciclova-muted/50">
                    </div>
                </div>

                <!-- Correo Electrónico -->
                <div class="relative mb-4">
                    <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-ciclova-muted text-lg"></i>
                    <input type="email" required placeholder="Correo electrónico" 
                        class="w-full bg-ciclova-bg border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white text-sm focus:border-ciclova-neon focus:ring-1 focus:ring-ciclova-neon focus:outline-none transition-all placeholder-ciclova-muted/50">
                </div>

                <!-- Contraseña -->
                <div class="relative mb-4">
                    <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-ciclova-muted text-lg"></i>
                    <input type="password" id="password-input" required placeholder="Contraseña" 
                        class="w-full bg-ciclova-bg border border-white/10 rounded-xl py-3.5 pl-12 pr-12 text-white text-sm focus:border-ciclova-neon focus:ring-1 focus:ring-ciclova-neon focus:outline-none transition-all placeholder-ciclova-muted/50">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-ciclova-muted hover:text-white transition-colors outline-none">
                        <i id="eye-icon" class="ph ph-eye text-lg"></i>
                    </button>
                </div>

                <!-- Opciones Extra (Recordarme / Olvidé contraseña) -->
                <div id="options-group" class="flex items-center justify-between mb-6 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-4 h-4 rounded border border-ciclova-muted group-hover:border-ciclova-neon transition-colors">
                            <input type="checkbox" class="peer opacity-0 absolute w-full h-full cursor-pointer">
                            <i class="ph-bold ph-check text-[10px] text-ciclova-bg opacity-0 peer-checked:opacity-100 peer-checked:text-ciclova-neon absolute transition-opacity"></i>
                        </div>
                        <span class="text-xs text-ciclova-muted group-hover:text-white transition-colors">Recordarme</span>
                    </label>
                    <a href="#" class="text-xs text-ciclova-neon hover:underline">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Principal de Envío -->
                <button type="submit" id="submit-btn" class="w-full bg-ciclova-neon text-ciclova-bg font-bold py-3.5 rounded-xl hover:bg-[#2FE05A] transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(57,255,107,0.2)] hover:shadow-[0_0_25px_rgba(57,255,107,0.4)] mb-6 transform hover:-translate-y-0.5">
                    Entrar
                </button>
                
                <!-- Divisor -->
                <div class="flex items-center gap-3 mb-6">
                    <div class="flex-grow h-px bg-white/10"></div>
                    <span class="text-xs text-ciclova-muted">o</span>
                    <div class="flex-grow h-px bg-white/10"></div>
                </div>

                <!-- Botones Sociales -->
                <div class="space-y-3">
                    <button type="button" class="w-full bg-transparent border border-white/10 rounded-xl py-3 flex items-center justify-center gap-3 hover:bg-white/5 transition-colors text-sm font-medium">
                        <i class="ph-fill ph-google-logo text-xl"></i>
                        <span class="text-white">Continuar con Google</span>
                    </button>
                    <button type="button" class="w-full bg-transparent border border-white/10 rounded-xl py-3 flex items-center justify-center gap-3 hover:bg-white/5 transition-colors text-sm font-medium">
                        <i class="ph-fill ph-apple-logo text-xl"></i>
                        <span class="text-white">Continuar con Apple</span>
                    </button>
                </div>
            </form>

            <!-- NUEVO: Modal de Selección (Oculto inicialmente) -->
            <div id="demo-selector" class="hidden text-center py-4">
                <i class="ph-fill ph-check-circle text-ciclova-neon text-6xl mb-4 drop-shadow-[0_0_15px_rgba(57,255,107,0.5)]"></i>
                <h3 class="text-2xl font-bold text-white mb-2">¡Acceso Exitoso!</h3>
                <p class="text-ciclova-muted text-sm mb-8">¿Qué vista deseas mostrar en la presentación?</p>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Botón para Cliente -->
                    <a href="dashboard.html" class="flex flex-col items-center gap-3 bg-ciclova-bg border border-white/10 hover:border-ciclova-neon/50 p-4 rounded-2xl hover:-translate-y-1 transition-all group shadow-lg">
                        <div class="w-14 h-14 bg-ciclova-card rounded-full flex items-center justify-center group-hover:bg-ciclova-neon transition-colors">
                            <i class="ph-fill ph-user text-2xl text-ciclova-muted group-hover:text-ciclova-bg transition-colors"></i>
                        </div>
                        <span class="text-sm font-medium text-white">Vista Cliente</span>
                    </a>
                    
                    <!-- Botón para Admin -->
                    <a href="admin.html" class="flex flex-col items-center gap-3 bg-ciclova-bg border border-white/10 hover:border-[#FF4B4B]/50 p-4 rounded-2xl hover:-translate-y-1 transition-all group shadow-lg">
                        <div class="w-14 h-14 bg-ciclova-card rounded-full flex items-center justify-center group-hover:bg-[#FF4B4B] transition-colors">
                            <i class="ph-fill ph-wrench text-2xl text-ciclova-muted group-hover:text-white transition-colors"></i>
                        </div>
                        <span class="text-sm font-medium text-white">Vista Admin</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Notificación (Toast) -->
    <div id="custom-toast" class="fixed top-6 right-1/2 transform translate-x-1/2 -translate-y-24 opacity-0 bg-ciclova-card border border-ciclova-neon text-white px-6 py-3 rounded-full shadow-[0_0_15px_rgba(57,255,107,0.2)] flex items-center gap-3 transition-all duration-400 ease-out z-50 pointer-events-none">
        <div class="w-6 h-6 rounded-full bg-ciclova-neon/20 flex items-center justify-center shrink-0">
            <i class="ph-bold ph-check text-ciclova-neon text-sm"></i>
        </div>
        <span id="toast-message" class="font-medium text-sm"></span>
    </div>

    <!-- Script de Interactividad -->
    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            if (currentMode === mode) return;
            currentMode = mode;

            const toggleBg = document.getElementById('toggle-bg');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');
            const formTitle = document.getElementById('form-title');
            const nameGroup = document.getElementById('name-group');
            const optionsGroup = document.getElementById('options-group');
            const submitBtn = document.getElementById('submit-btn');
            const nameInput = document.getElementById('name-input');

            if (mode === 'register') {
                toggleBg.style.transform = 'translateX(100%)';
                btnRegister.classList.remove('text-ciclova-muted');
                btnRegister.classList.add('text-white');
                btnLogin.classList.remove('text-white');
                btnLogin.classList.add('text-ciclova-muted');
                
                formTitle.textContent = 'Crear cuenta';
                nameGroup.classList.remove('collapsed');
                nameGroup.classList.add('mb-4');
                nameInput.setAttribute('required', 'true');
                optionsGroup.style.display = 'none';
                submitBtn.textContent = 'Registrarse';
            } else {
                toggleBg.style.transform = 'translateX(0)';
                btnLogin.classList.remove('text-ciclova-muted');
                btnLogin.classList.add('text-white');
                btnRegister.classList.remove('text-white');
                btnRegister.classList.add('text-ciclova-muted');
                
                formTitle.textContent = 'Iniciar sesión';
                nameGroup.classList.add('collapsed');
                nameGroup.classList.remove('mb-4');
                nameInput.removeAttribute('required');
                optionsGroup.style.display = 'flex';
                submitBtn.textContent = 'Entrar';
            }
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('ph-eye');
                eyeIcon.classList.add('ph-eye-slash', 'text-ciclova-neon');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('ph-eye-slash', 'text-ciclova-neon');
                eyeIcon.classList.add('ph-eye');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('custom-toast');
            const messageEl = document.getElementById('toast-message');
            messageEl.textContent = message;
            
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, 3000);
        }

        function handleAuth(event) {
            event.preventDefault(); // Evita recargar la página

            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            
            // Efecto de carga visual
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> Procesando...`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simular un retardo de red (1.5 segundos)
            setTimeout(() => {
                if (currentMode === 'login') {
                    showToast('¡Bienvenido de vuelta a CICLOVA!');
                } else {
                    showToast('¡Cuenta creada con éxito! Bienvenido.');
                }
                
                // 1. Ocultar el formulario, el título y el toggle
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('toggle-container').classList.add('hidden');
                document.getElementById('form-title').classList.add('hidden');

                // 2. Mostrar la pantalla de selección (Modal)
                const demoSelector = document.getElementById('demo-selector');
                demoSelector.classList.remove('hidden');
                demoSelector.classList.add('fade-in-up'); // Añade la animación que pusimos en CSS
                
            }, 1500);
        }
    </script>
</body>
</html>
